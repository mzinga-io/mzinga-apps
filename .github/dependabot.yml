# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # mzinga core (Payload v2) requires Express 4: its middleware assigns req.query, read-only in Express 5.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
    groups:
      minors:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions need their own directory.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    groups:
      minors:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/examples/*"
    schedule:
      interval: "daily"
    groups:
      minors:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Private ACR image published by this repo's own pipeline: Dependabot has no credentials
      # for it and the whole docker-compose update job fails on it.
      - dependency-name: "newesissrl.azurecr.io/mzinga/payload/gh/backoffice"
      - dependency-name: "mzinga/payload/gh/backoffice"
    groups:
      minors:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
